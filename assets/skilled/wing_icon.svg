    <!-- Main wing feathers -->
    <!-- Lower feather -->
    <path d="M18 36 C12 38 12 46 19 49 C26 52 35 48 42 42" fill="#FFF8EE"/>
    <!-- Middle feather -->
    <path d="M19 49 C26 52 38 46 48 37 C54 32 58 26 56 20 C54 14 47 16 41 22" fill="#FFFDF8"/>
